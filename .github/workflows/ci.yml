name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node --test
    # The app is plain ES modules loaded into a shim by the suites, so this
    # needs node and nothing else -- no build, no browser, no install step.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      # Includes the road-food.sha256 check: this copy of the kit's file is
      # what a coach's picks are ticked against, and deploy.sh ships whatever
      # is here straight to the live site.
      # The files are listed by glob rather than as "coach/", because node 24
      # reads a bare directory as a module to load and fails; node 26 walks it.
      # Spelling out the files works on both.
      - name: Unit tests
        run: node --test coach/*.test.mjs
